services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: settlement_ledger
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  authorization-migrate:
    build:
      context: ./services/authorization
    command: ["npx", "tsx", "db/migrate.ts"]
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/settlement_ledger"
    depends_on:
      postgres:
        condition: service_healthy

  ledger-migrate:
    build:
      context: ./services/ledger
    command: ["npx", "tsx", "db/migrate.ts"]
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/settlement_ledger"
    depends_on:
      postgres:
        condition: service_healthy

  payout-migrate:
    build:
      context: ./services/payout
    command: ["npx", "tsx", "db/migrate.ts"]
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/settlement_ledger"
    depends_on:
      postgres:
        condition: service_healthy

  mock-payout-psp:
    build:
      context: ./mock-payout-psp
    environment:
      PORT: "4003"
    ports:
      - "4003:4003"

  authorization:
    build:
      context: ./services/authorization
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/settlement_ledger"
      KAFKA_BROKERS: "kafka:29092"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-migrate:
        condition: service_completed_successfully
    restart: on-failure

  ledger:
    build:
      context: ./services/ledger
    environment:
      PORT: "3002"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/settlement_ledger"
      KAFKA_BROKERS: "kafka:29092"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      ledger-migrate:
        condition: service_completed_successfully
    restart: on-failure

  payout:
    build:
      context: ./services/payout
    environment:
      PORT: "3003"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/settlement_ledger"
      KAFKA_BROKERS: "kafka:29092"
      PSP_BASE_URL: "http://mock-payout-psp:4003"
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      payout-migrate:
        condition: service_completed_successfully
      mock-payout-psp:
        condition: service_started
    restart: on-failure
